---
- name: Provision Redis golden image
  hosts: all
  become: yes
  vars:
    app_user: "redis"
    app_name: "redis"
    app_version: "{{ lookup('env', 'SERVICE_VERSION') }}"
    nexus_url: "{{ lookup('env', 'NEXUS_URL') }}"
    service_port: "{{ lookup('env', 'SERVICE_PORT') | default('1222') }}"
    eureka_port: "{{ lookup('env', 'EUREKA_PORT') | default('8761') }}"
    eureka_host: "{{ lookup('env', 'EUREKA_HOST') | default('192.168.29.63') }}"

  tasks:
    - name: Install Java 17
      apt:
        name: openjdk-17-jre-headless
        state: present
        update_cache: yes

    - name: Install Redis Server
      apt:
        name: redis-server
        state: present

    - name: Start and enable Redis
      systemd:
        name: redis-server
        state: started
        enabled: yes

    - name: Ensure redis user exists
      user:
        name: "{{ app_user }}"
        system: yes
        home: "/opt/{{ app_name }}"
        create_home: yes
        state: present
      ignore_errors: yes

    - name: Create application directory
      file:
        path: "/opt/{{ app_name }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Create application.yml with environment variables support
      copy:
        dest: "/opt/{{ app_name }}/application.yml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
        content: |
          server:
            port: "${SERVER_PORT:{{ service_port }}}"
          
          spring:
            application:
              name: "${SPRING_APP_NAME:{{ app_name }}}"
            redis:
              host: "${REDIS_HOST:localhost}"
              port: "${REDIS_PORT:6379}"
          
          eureka:
            client:
              service-url:
                defaultZone: "${EUREKA_URL}"
            instance:
              prefer-ip-address: true
              instance-id: "${spring.cloud.client.ip-address}:${server.port}"
          
          logging:
            level:
              com.ksapp.redis: INFO
              org.springframework.cloud.netflix.eureka: DEBUG
          
          management:
            endpoints:
              web:
                exposure:
                  include: health,info
            endpoint:
              health:
                show-details: always

    - name: Create environment file
      copy:
        dest: "/opt/{{ app_name }}/{{ app_name }}.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
        content: |
          EUREKA_URL=http://{{ eureka_host }}:{{ eureka_port }}/eureka/
          SERVER_PORT={{ service_port }}
          SPRING_APP_NAME={{ app_name }}
          REDIS_HOST=localhost
          REDIS_PORT=6379

    - name: Download Redis JAR from Nexus
      get_url:
        url: "{{ nexus_url }}/com/ksapp/redis/{{ app_version }}/redis-{{ app_version }}.jar"
        dest: "/opt/{{ app_name }}/{{ app_name }}.jar"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
        timeout: 120
      retries: 5
      delay: 10
      register: download_result
      until: download_result is success

    - name: Verify JAR file was downloaded
      stat:
        path: "/opt/{{ app_name }}/{{ app_name }}.jar"
      register: jar_file

    - name: Fail if JAR not downloaded
      fail:
        msg: "JAR file was not downloaded successfully from Nexus"
      when: not jar_file.stat.exists or jar_file.stat.size == 0

    - name: Create systemd service file with environment file support
      copy:
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Redis API Service
          After=network.target redis-server.service
          Wants=network.target
          
          [Service]
          User={{ app_user }}
          Group={{ app_user }}
          WorkingDirectory=/opt/{{ app_name }}
          EnvironmentFile=-/opt/{{ app_name }}/{{ app_name }}.env
          ExecStart=/usr/bin/java -jar /opt/{{ app_name }}/{{ app_name }}.jar
          SuccessExitStatus=143
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          
          TimeoutStartSec=300
          TimeoutStopSec=120
          
          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable service
      systemd:
        name: "{{ app_name }}"
        enabled: yes

    - name: Start service
      systemd:
        name: "{{ app_name }}"
        state: started

    - name: Display service status
      debug:
        msg: |
          ========================================
          Redis Deployment Complete!
          ========================================
          Service Name: {{ app_name }}
          Service Port: {{ service_port }}
          Eureka URL: http://{{ eureka_host }}:{{ eureka_port }}/eureka/
          Redis Host: localhost
          Redis Port: 6379
          ========================================