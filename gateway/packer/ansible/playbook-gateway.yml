---
- name: Provision Gateway golden image
  hosts: all
  become: yes
  vars:
    app_user: "gateway"
    app_name: "gateway"
    app_version: "{{ lookup('env', 'SERVICE_VERSION') }}"
    nexus_url: "{{ lookup('env', 'NEXUS_URL') }}"

  tasks:
    - name: Install Java 17
      apt:
        name: openjdk-17-jre-headless
        state: present
        update_cache: yes

    - name: Create gateway user
      user:
        name: "{{ app_user }}"
        system: yes
        home: "/opt/{{ app_name }}"
        create_home: yes

    - name: Create application directory
      file:
        path: "/opt/{{ app_name }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Download Gateway JAR from Nexus
      get_url:
        url: "{{ nexus_url }}/com/ksapp/{{ app_name }}/{{ app_version }}/{{ app_name }}-{{ app_version }}.jar"
        dest: "/opt/{{ app_name }}/{{ app_name }}.jar"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
        timeout: 120
      retries: 5
      delay: 10
      register: download_result
      until: download_result is success

    - name: Verify JAR file was downloaded
      stat:
        path: "/opt/{{ app_name }}/{{ app_name }}.jar"
      register: jar_file

    # NO environment file creation here - will be created by Terraform
    # NO systemd service creation here - will be created by Terraform
    # NO application.yml creation here - already inside the JAR

    - name: Clean up logs before AMI creation
      shell: |
        journalctl --rotate
        journalctl --vacuum-time=1s
        rm -rf /var/log/journal/*
        rm -f /root/.bash_history
        rm -f /home/ubuntu/.bash_history
        apt-get clean
      ignore_errors: yes